# HyTwin 2.0 — Pilot Scenario
# ============================================================
# A small but complete H2-based energy grid serving a light
# industrial / prosumer community in southern Italy (Campania).
#
# Components:
#   - 3 wind turbines (2 MW each)
#   - 1 PV array (500 kW peak)
#   - 1 PEM electrolyzer (300 kW)
#   - 1 PEM fuel cell (100 kW)
#   - 1 compressed H2 tank (350 bar, ~350 kg usable)
#   - 1 aggregated industrial load (400 kW peak)
# ============================================================

name: "pilot_campania_h2grid"
start_time: "2024-06-15T00:00:00"
dt_seconds: 60          # 1-minute steps
episode_steps: 1440     # 24 hours

# ------------------------------------------------------------------
# Grid topology
# ------------------------------------------------------------------
grid:

  wind_turbines:
    - id: wt1
      params:
        rotor_diameter_m: 90.0
        hub_height_m: 80.0
        rated_power_kw: 2000.0
        v_cut_in: 3.0
        v_rated: 12.0
        v_cut_out: 25.0
        efficiency_gen: 0.94
        altitude_m: 150.0
        wake_loss_factor: 0.05
        turbulence_intensity: 0.06
    - id: wt2
      params:
        rotor_diameter_m: 90.0
        hub_height_m: 80.0
        rated_power_kw: 2000.0
        v_cut_in: 3.0
        v_rated: 12.0
        v_cut_out: 25.0
        efficiency_gen: 0.94
        altitude_m: 150.0
        wake_loss_factor: 0.07
        turbulence_intensity: 0.06
    - id: wt3
      params:
        rotor_diameter_m: 90.0
        hub_height_m: 80.0
        rated_power_kw: 2000.0
        v_cut_in: 3.0
        v_rated: 12.0
        v_cut_out: 25.0
        efficiency_gen: 0.94
        altitude_m: 160.0
        wake_loss_factor: 0.05
        turbulence_intensity: 0.07

  pv_arrays:
    - id: pv1
      params:
        n_panels: 1200
        panel_area_m2: 1.96
        eta_stc: 0.205
        temp_coeff_pmax: -0.0038
        noct_c: 45.0
        rated_power_kw: 500.0
        soiling_loss: 0.02
        degradation_per_year: 0.005
        tilt_deg: 28.0
        azimuth_deg: 180.0
        iam_b0: 0.05
        inverter_efficiency: 0.0    # use curve

  electrolyzers:
    - id: el1
      params:
        rated_power_kw: 300.0
        n_cells: 120
        cell_area_cm2: 400.0
        membrane_resistance_ohm_cm2: 0.16
        i_exchange_A_cm2: 0.001
        alpha_a: 0.5
        temperature_c: 65.0
        min_load_fraction: 0.05
        ramp_rate_kw_s: 5.0
        degradation_rate: 0.00001
        water_flow_l_h_kw: 0.9

  fuel_cells:
    - id: fc1
      params:
        rated_power_kw: 100.0
        n_cells: 170
        cell_area_cm2: 1500.0
        membrane_resistance_ohm_cm2: 0.12
        i_exchange_A_cm2: 0.001
        alpha_c: 0.4
        temperature_c: 65.0
        h2_utilisation: 0.80
        min_load_fraction: 0.10
        ramp_rate_kw_s: 2.0
        degradation_rate: 0.00002

  hydrogen_tanks:
    - id: tk1
      params:
        volume_m3: 5.0
        max_pressure_bar: 350.0
        min_pressure_bar: 10.0
        initial_soc: 0.50
        temperature_c: 20.0
        max_charge_rate_kg_s: 0.05
        max_discharge_rate_kg_s: 0.03
        boiloff_rate_per_day: 0.0

  loads:
    - id: load1
      params:
        base_load_kw: 400.0
        profile_type: "industrial"
        noise_std_fraction: 0.04
        seasonal_amplitude: 0.08
        demand_response_factor: 0.15

# ------------------------------------------------------------------
# Weather — Campania (Salerno area)
# ------------------------------------------------------------------
weather:
  latitude_deg: 40.68
  longitude_deg: 14.76
  altitude_m: 150.0
  weibull_k: 2.1
  weibull_c: 6.8
  autocorr_wind: 0.93
  cloud_cover_mean: 0.30
  temp_mean_c: 16.5
  temp_amplitude_c: 11.0

# ------------------------------------------------------------------
# Virtual sensors
# ------------------------------------------------------------------
sensors:
  # Wind turbine power
  - id: wt1.power
    type: power
    model_key: "wt1.power_kw"
    noise_std_kw: 8.0
    drift_rate_kw: 0.1
    delay_steps: 0
    quantisation_step: 1.0
    fault_probability: 0.0001

  - id: wt2.power
    type: power
    model_key: "wt2.power_kw"
    noise_std_kw: 8.0
    drift_rate_kw: 0.1
    delay_steps: 0
    quantisation_step: 1.0

  - id: wt3.power
    type: power
    model_key: "wt3.power_kw"
    noise_std_kw: 8.0
    drift_rate_kw: 0.1
    delay_steps: 0
    quantisation_step: 1.0

  # PV power
  - id: pv1.power
    type: power
    model_key: "pv1.power_ac_kw"
    noise_std_kw: 5.0
    drift_rate_kw: 0.05
    delay_steps: 0
    quantisation_step: 0.5

  # Electrolyzer
  - id: el1.power
    type: power
    model_key: "el1.power_kw"
    noise_std_kw: 3.0
    drift_rate_kw: 0.05
    delay_steps: 1

  - id: el1.h2flow
    type: flow
    model_key: "el1.h2_flow_kg_h"
    noise_std_kg_h: 0.05
    drift_rate_kg_h: 0.002
    delay_steps: 1
    fault_probability: 0.0005

  # Fuel cell
  - id: fc1.power
    type: power
    model_key: "fc1.power_kw"
    noise_std_kw: 2.0
    drift_rate_kw: 0.03
    delay_steps: 0

  # H2 tank
  - id: tk1.pressure
    type: pressure
    model_key: "tk1.pressure_bar"
    noise_std_bar: 1.0
    drift_rate_bar: 0.02
    delay_steps: 0
    quantisation_step: 0.5
    fault_probability: 0.0002

  - id: tk1.h2level
    type: h2_level
    model_key: "tk1.mass_kg"
    noise_std_kg: 1.0
    drift_rate_kg: 0.05
    delay_steps: 0

  # Load power metering
  - id: load1.power
    type: power
    model_key: "load1.load_kw"
    noise_std_kw: 2.0
    drift_rate_kw: 0.02
    delay_steps: 0
