# HyTwin — Large Realistic Italian H2 Network (7 nodes)
# ==========================================================================
# A geographically distributed hydrogen backbone with SPECIALISED nodes —
# technical infrastructure is placed realistically (producers in the sunny/
# windy south & islands, consumers in the industrial north), not lumped in one
# spot.  Each node carries only the equipment that makes sense for its role.
#
#   SICILIA   Trapani  — sun+wind PRODUCER (PV, wind, big electrolysis, storage)
#   SARDEGNA  Cagliari — wind PRODUCER (subsea H2/elec link to the mainland)
#   PUGLIA    Taranto  — wind+PV PRODUCER / storage HUB (+1 fuel cell)
#   CAMPANIA  Napoli   — balancing HUB (mixed gen + fuel cells + storage)
#   LAZIO     Roma     — CONSUMER (large load, fuel cells, little local gen)
#   EMILIA    Bologna  — transit / CONSUMER
#   LOMBARDIA Milano   — heavy industrial CONSUMER (huge load, fuel-cell fleet)
#
# Everything is data-driven: edit this file to change sites, sizes, links.
# Link lengths auto-compute from coordinates.  Weather / load / price all vary
# in time per node (local climatology + market zone).
# ==========================================================================

name: "italy_h2_network_large"
start_time: "2024-06-15T00:00:00"
dt_seconds: 600          # 10-minute steps
episode_steps: 144

network:
  sites:

    # ===== SICILIA — Trapani (sun + wind PRODUCER) ==========================
    - id: trapani
      location: { name: "Trapani", lat: 37.98, lon: 12.51, alt_m: 20 }
      weather: { weibull_k: 2.2, weibull_c: 7.2, autocorr_wind: 0.91, cloud_cover_mean: 0.20, temp_mean_c: 19.5, temp_amplitude_c: 11 }
      energy_cost: { f1_price: 0.23, f2_price: 0.15, f3_price: 0.08, price_volatility: 0.10, seasonal_amplitude: 0.20, spike_prob_per_day: 0.05, spike_multiplier: 3.0, spike_duration_steps: 4, sell_ratio: 0.30 }
      grid:
        wind_turbines:
          - { id: trapani_wt1, params: { rotor_diameter_m: 82, hub_height_m: 85, rated_power_kw: 500, v_cut_in: 3, v_rated: 12, v_cut_out: 25, efficiency_gen: 0.94, altitude_m: 20, turbulence_intensity: 0.07 } }
          - { id: trapani_wt2, params: { rotor_diameter_m: 82, hub_height_m: 85, rated_power_kw: 500, v_cut_in: 3, v_rated: 12, v_cut_out: 25, efficiency_gen: 0.94, altitude_m: 20, turbulence_intensity: 0.08 } }
        pv_arrays:
          - { id: trapani_pv1, params: { n_panels: 600, panel_area_m2: 1.96, eta_stc: 0.205, temp_coeff_pmax: -0.0038, noct_c: 45, rated_power_kw: 300, soiling_loss: 0.03, degradation_per_year: 0.005, tilt_deg: 28, azimuth_deg: 180 } }
          - { id: trapani_pv2, params: { n_panels: 600, panel_area_m2: 1.96, eta_stc: 0.205, temp_coeff_pmax: -0.0038, noct_c: 45, rated_power_kw: 300, soiling_loss: 0.03, degradation_per_year: 0.005, tilt_deg: 25, azimuth_deg: 175 } }
          - { id: trapani_pv3, params: { n_panels: 600, panel_area_m2: 1.96, eta_stc: 0.205, temp_coeff_pmax: -0.0038, noct_c: 45, rated_power_kw: 300, soiling_loss: 0.04, degradation_per_year: 0.005, tilt_deg: 30, azimuth_deg: 185 } }
        electrolyzers:
          - { id: trapani_el1, params: { rated_power_kw: 300, n_cells: 100, cell_area_cm2: 400, membrane_resistance_ohm_cm2: 0.16, temperature_c: 65, min_load_fraction: 0.05, ramp_rate_kw_s: 5 } }
          - { id: trapani_el2, params: { rated_power_kw: 300, n_cells: 100, cell_area_cm2: 400, membrane_resistance_ohm_cm2: 0.16, temperature_c: 65, min_load_fraction: 0.05, ramp_rate_kw_s: 5 } }
          - { id: trapani_el3, params: { rated_power_kw: 300, n_cells: 100, cell_area_cm2: 400, membrane_resistance_ohm_cm2: 0.17, temperature_c: 65, min_load_fraction: 0.05, ramp_rate_kw_s: 5 } }
        hydrogen_tanks:
          - { id: trapani_tk1, params: { volume_m3: 14, max_pressure_bar: 700, min_pressure_bar: 10, initial_soc: 0.50, temperature_c: 20, max_charge_rate_kg_s: 0.08, max_discharge_rate_kg_s: 0.05, boiloff_rate_per_day: 0 } }
          - { id: trapani_tk2, params: { volume_m3: 14, max_pressure_bar: 700, min_pressure_bar: 10, initial_soc: 0.45, temperature_c: 20, max_charge_rate_kg_s: 0.08, max_discharge_rate_kg_s: 0.05, boiloff_rate_per_day: 0 } }
        loads:
          - { id: trapani_load, params: { base_load_kw: 150, profile_type: "commercial", noise_std_fraction: 0.06, seasonal_amplitude: 0.12, demand_response_factor: 0.15 } }
